name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: android-actions/setup-android@v3 removed the api-level /
      # build-tools inputs (they are silently ignored). Use the `packages`
      # input instead. v3 also installs cmdline-tools + platform-tools, so
      # sdkmanager is on PATH for the license-accept step below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # Uses an explicit Gradle version so the build does not depend on the
      # wrapper jar being committed. Keep gradle-version in sync with
      # gradle/wrapper/gradle-wrapper.properties.
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: ":app:assembleDebug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
